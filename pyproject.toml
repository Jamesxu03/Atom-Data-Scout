[project]
name = "atom-data-scout"
version = "0.1.0"
description = "Find and rank data-source companies: search, crawl, Gemini extraction, scoring, daily distress scan"
requires-python = ">=3.12"
dependencies = [
    # LLM
    "google-genai",
    # data models
    "pydantic>=2",
    # HTTP + crawling + main-text extraction
    "httpx",
    "trafilatura",
    "playwright",
    # database (phase 2 worker reads jobs from Supabase)
    "supabase",
    # phase 1 UI
    "streamlit",
    "pandas",
    # config
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
