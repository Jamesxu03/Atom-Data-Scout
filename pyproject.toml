[project]
name = "atom-data-scout"
version = "0.1.0"
description = "Find companies likely to hold the data a buyer wants, rank and verify them, and draft outreach"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LLM
    "google-genai",
    # data models
    "pydantic>=2",
    # HTTP + crawling + main-text extraction
    "httpx",
    "trafilatura",
    "playwright",
    # UI
    "streamlit",
    "pandas",
    # config
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["live: makes real Gemini calls (uses quota)"]
